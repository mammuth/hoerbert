name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

env:
  IMAGE: ghcr.io/mammuth/hoerbert

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Pull & restart on hetzner1
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "hetzner1.max-muth.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMX9QeozQFQ1nqy/8TL6KPq/5TXnT9qte5LtW0G61wgf" > ~/.ssh/known_hosts
          # Key is restricted to /root/hoerbert/deploy.sh on the server; token goes via stdin.
          echo "$GHCR_TOKEN" | ssh root@hetzner1.max-muth.de
