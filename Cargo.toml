[package]
name = "hoerbert"
version = "0.1.0"
edition = "2021"
description = "TeamSpeak music bot with a shared web UI (yt-dlp + ffmpeg + Opus)"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json"] }
url = "2"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
audiopus = "0.3.0-rc.0"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5", default-features = false, features = ["default-tls", "audio"] }
# Voice commands (Whisper). Shared libs (upstream static archives ship no .a files), copied next to the binary.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
